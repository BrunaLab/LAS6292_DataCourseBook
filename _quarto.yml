csl: format/ecology.csl
format:

  html:
    theme: 
      - cosmo
      - format/r4ds.scss
      
  pdf:
    documentclass: scrbook
    classoption: ["oneside", "open=any"]
    cover-image: images/cover2.png
    # template-partials:
    #   - "protocols/title.tex"
    # header-includes: |
    #    \titlehead{\includegraphics[height=9in]{images/cover2.png}}
    toc: true
    toc-depth: 2
    toc-title: Table of Contents
    lof: true
    lot: true
    bibliography: las6292.bib
    # Numbering
    number-sections: true
    # Fonts
    # fontfamily: libertinus
    # mainfont: Georgia
    # sansfont: Verdana
    # monofont: Source Code Pro
    # fontsize: 12pt
    microtypeoptions: ["final"]
    # Colors
    colorlinks: true
    # Layout
    geometry:
      - margin=1in
      - bindingoffset=0.5in
      # - left=24mm
      # - top=24mm
      # - bottom=24mm 
      # - right=50mm
      # - heightrounded
      # - footskip=0.475in
      # - showframe
    # pagestyle: plain
    # Rendering
    keep-tex: true
